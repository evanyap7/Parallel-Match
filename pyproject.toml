[project]
name = "parallel-match"
version = "0.1.0"
description = "Seeded, forkable, event-level football simulator with synthetic data"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
parallel-match = "parallel_match.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools]
packages = ["parallel_match"]

[tool.setuptools.package-data]
parallel_match = ["data/*.json", "data/forks/*/*.json"]
