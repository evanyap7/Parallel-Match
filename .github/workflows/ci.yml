name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Simulator, agents and MCP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # dev brings FastAPI, httpx and MCP; foundry brings Microsoft Agent
      # Framework, so the agent tool tests run too. No cloud credentials are
      # used: the agents run on the deterministic template provider.
      - run: pip install -e ".[dev,foundry]"
      - run: python -m unittest discover -s tests -t . -v

  frontend:
    name: Front end tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
